keyvalues:
  - name: omnitrust-redis
    ipAllowList: [] # Internal service communication only

services:
  - type: web
    name: omnitrust-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: REDIS_URL
        fromKeyValue:
          name: omnitrust-redis
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: LOGISTICS_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: omnitrust-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker.celery_app worker --loglevel=info
    envVars:
      - key: APP_ENV
        value: production
      - key: REDIS_URL
        fromKeyValue:
          name: omnitrust-redis
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: LOGISTICS_WEBHOOK_SECRET
        sync: false

  - type: web
    name: omnitrust-logistics
    runtime: python
    rootDir: mock-logistics/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LOGISTICS_WEBHOOK_SECRET
        sync: false
      - key: OMNITRUST_WEBHOOK_URL
        value: https://omnitrust-api.onrender.com/api/webhooks/logistics

  - type: web
    name: omnitrust-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        value: https://omnitrust-api.onrender.com
      - key: BACKEND_URL
        value: https://omnitrust-api.onrender.com
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false
      - key: VITE_LOGISTICS_URL
        value: https://omnitrust-logistics.onrender.com
